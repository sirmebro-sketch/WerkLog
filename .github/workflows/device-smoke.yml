name: Android Bedienablauf im Emulator
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/device-smoke.yml'
permissions:
  contents: read
concurrency:
  group: device-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: KVM aktivieren
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle --no-daemon connectedDebugAndroidTest && adb pull /sdcard/Android/data/de.werklog.app/files/betrieb.png betrieb.png
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Android-Layout
          path: betrieb.png
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: Android-Gerätetest-Fehlerbericht
          path: app/build/reports/androidTests/
          retention-days: 3
